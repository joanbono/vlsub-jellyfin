overview: "Subtitles from opensubtitles.org, matched by file hash. No API key."
description: >
  Downloads subtitles from the keyless XML-RPC API on opensubtitles.org, the same
  one the vlsub VLC extension uses. Files are identified by their OpenSubtitles
  hash, so a match is timed against your exact release rather than merely the
  right title. Also repairs uploads whose multi-line cues were split across
  duplicate timings, which otherwise render bottom-to-top.
